apiVersion: batch/v1
kind: Job
metadata:
  name: mari-scheduled-tasks-graph
  namespace: stack
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
      - name: register
        image: mari-app-base:local
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        command:
        - python
        - /scripts/register.py
        env:
        - name: MARI_APP_ID
          value: scheduled-tasks
        - name: ORCHID_GRAPH
          value: scheduled_tasks
        - name: ORCHID_CATALOG_CLIENT_ID
          value: admin
        - name: ORCHID_CATALOG_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: orchid-catalog
              key: admin.secret
        - name: POLARIS_SECRET
          valueFrom:
            secretKeyRef:
              name: polaris
              key: client-secret
        - name: ICEBERG_CREDENTIAL
          value: root:$(POLARIS_SECRET)
        envFrom:
        - secretRef:
            name: mari-runtime
        - secretRef:
            name: aws-credentials
        volumeMounts:
        - name: script
          mountPath: /scripts
      volumes:
      - name: script
        configMap:
          name: mari-scheduled-tasks-graph
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mari-scheduled-tasks
  namespace: stack
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: '1'
        autoscaling.knative.dev/max-scale: '3'
    spec:
      containerConcurrency: 2
      timeoutSeconds: 120
      containers:
      - image: mari-scheduled-tasks:local
        ports:
        - containerPort: 8080
        env:
        - name: MARI_APP_ID
          value: scheduled-tasks
        - name: ORCHID_GRAPH
          value: scheduled_tasks
        - name: ORCHID_CATALOG_CLIENT_ID
          value: admin
        - name: ORCHID_CATALOG_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: orchid-catalog
              key: admin.secret
        - name: POLARIS_SECRET
          valueFrom:
            secretKeyRef:
              name: polaris
              key: client-secret
        - name: ICEBERG_CREDENTIAL
          value: root:$(POLARIS_SECRET)
        envFrom:
        - secretRef:
            name: mari-runtime
        - secretRef:
            name: aws-credentials
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  namespace: mari-platform
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: mari-platform
data:
  init.sql: 'CREATE DATABASE temporal;

    CREATE DATABASE temporal_visibility;

    CREATE DATABASE iceberg;

    '
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mari-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16.8
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        env:
        - name: POSTGRES_USER
          value: mari
        - name: POSTGRES_DB
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: DB_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - mari
            - -d
            - postgres
          periodSeconds: 5
        args:
        - postgres
        - -c
        - wal_level=logical
        - -c
        - max_replication_slots=10
        - -c
        - max_wal_senders=10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres
      - name: init
        configMap:
          name: postgres-init
      enableServiceLinks: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mari-platform
spec:
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: mari-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: temporal
    spec:
      containers:
      - name: temporal
        image: temporalio/auto-setup:1.27.2
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            memory: 1Gi
        env:
        - name: DB
          value: postgres12
        - name: DB_PORT
          value: '5432'
        - name: POSTGRES_USER
          value: mari
        - name: POSTGRES_PWD
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: DB_PASSWORD
        - name: POSTGRES_SEEDS
          value: postgres
        ports:
        - containerPort: 7233
      enableServiceLinks: false
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: mari-platform
spec:
  selector:
    app: temporal
  ports:
  - name: http
    port: 7233
    targetPort: 7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: mari-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: temporal-ui
    spec:
      containers:
      - name: temporal-ui
        image: temporalio/ui:2.36.0
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        env:
        - name: TEMPORAL_ADDRESS
          value: temporal:7233
        - name: TEMPORAL_CORS_ORIGINS
          value: http://localhost:8080
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
          failureThreshold: 60
      enableServiceLinks: false
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: mari-platform
spec:
  selector:
    app: temporal-ui
  ports:
  - name: http
    port: 8080
    targetPort: 8080

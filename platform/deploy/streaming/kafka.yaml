apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: mari-evidence-curated
  namespace: mari-platform
  labels:
    strimzi.io/cluster: mari-kafka
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  topicName: mari.evidence.curated
  partitions: 1
  replicas: 1
  config:
    retention.ms: -1

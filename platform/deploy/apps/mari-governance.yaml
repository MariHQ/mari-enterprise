apiVersion: apps/v1
kind: Deployment
metadata:
  name: mari-governance
  namespace: mari-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mari-governance
  template:
    metadata:
      labels:
        app: mari-governance
    spec:
      containers:
      - name: governance
        image: localhost:5001/mari-governance:local
        ports:
        - containerPort: 8000
        env:
        - name: MARI_KNOWLEDGE_PROJECT_ID
          value: '1'
        - name: MARI_STATIC_DIR
          value: /app/static
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: mari-kafka-kafka-bootstrap:9092
        - name: MARI_COOKIE_SECURE
          value: 'false'
        - name: KNOWLEDGE_API_URL
          value: http://knowledge-api:8000
        - name: MARI_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: MARI_SERVICE_TOKEN
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
        envFrom:
        - secretRef:
            name: governance-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: mari-governance
  namespace: mari-platform
spec:
  selector:
    app: mari-governance
  ports:
  - port: 8000
    targetPort: 8000

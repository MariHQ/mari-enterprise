apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-api
  namespace: mari-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: knowledge-api}
  template:
    metadata:
      labels: {app: knowledge-api}
    spec:
      containers:
      - name: query
        image: localhost:5001/mari-knowledge:local
        ports: [{containerPort: 8000}]
        env:
        - name: KNOWLEDGE_BACKEND
          value: duckdb
        - name: MARI_SERVICE_TOKEN
          valueFrom:
            secretKeyRef: {name: platform-secrets, key: MARI_SERVICE_TOKEN}
        envFrom:
        - secretRef: {name: iceberg-catalog}
        - secretRef: {name: aws-s3}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 1Gi}
        readinessProbe:
          tcpSocket: {port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-api
  namespace: mari-platform
spec:
  selector: {app: knowledge-api}
  ports: [{port: 8000, targetPort: 8000}]

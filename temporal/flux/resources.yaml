apiVersion: v1
kind: ServiceAccount
metadata:
  name: mari-temporal
  namespace: stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mari-temporal-compaction
  namespace: stack
rules:
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mari-temporal-compaction
  namespace: stack
subjects:
- kind: ServiceAccount
  name: mari-temporal
  namespace: stack
roleRef:
  kind: Role
  name: mari-temporal-compaction
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mari-temporal
  namespace: stack
spec:
  replicas: 1
  selector:
    matchLabels: {app: mari-temporal}
  template:
    metadata:
      labels: {app: mari-temporal}
    spec:
      serviceAccountName: mari-temporal
      automountServiceAccountToken: true
      containers:
      - name: worker
        image: mari-temporal:local
        envFrom:
        - secretRef: {name: mari-worker}
        - secretRef: {name: aws-credentials}
        env:
        - {name: ORCHID_GRAPH, value: decisions}
        - {name: COMPACTION_IMAGE, value: mari-compaction:local}
        - {name: COMPACTION_CATALOG_SECRET, value: mari-iceberg-catalog}
        - {name: COMPACTION_AWS_SECRET, value: aws-credentials}
        - {name: MARI_JOB_NAMESPACE, value: stack}
        - name: ORCHID_CATALOG_CLIENT_SECRET
          valueFrom:
            secretKeyRef: {name: orchid-catalog, key: admin.secret}
        - name: ICEBERG_CREDENTIAL
          valueFrom:
            secretKeyRef: {name: polaris, key: credential}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 1Gi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mari-temporal-register
  namespace: stack
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
      - name: register
        image: mari-temporal:local
        command: [python, -m, temporal.bootstrap]
        envFrom:
        - secretRef: {name: mari-worker}
        env:
        - {name: TEMPORAL_JOBS_ENABLED, value: 'true'}

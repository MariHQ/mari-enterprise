schema:
  - {id: 1, name: project_id, type: string, required: true}
  - {id: 2, name: record_id, type: string, required: true}
  - {id: 3, name: event_id, type: string, required: true}
  - {id: 4, name: operation, type: string, required: true}
  - {id: 5, name: kind, type: string, required: true}
  - {id: 6, name: source, type: string, required: true}
  - {id: 7, name: title, type: string, required: false}
  - {id: 8, name: text, type: string, required: false}
  - {id: 9, name: url, type: string, required: false}
  - {id: 10, name: properties, type: string, required: false}
  - {id: 11, name: actor, type: string, required: false}
  - {id: 12, name: observed_at, type: long, required: true}
  - {id: 13, name: kafka_partition, type: int, required: true}
  - {id: 14, name: kafka_offset, type: long, required: true}
targets:
  current:
    namespace: mari_streams
    primary_key: [project_id, record_id]
    partition_keys: [project_id]
  history:
    namespace: mari_history
    primary_key: [project_id, record_id, event_id]
    partition_keys: [project_id]

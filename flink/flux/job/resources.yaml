apiVersion: v1
kind: ServiceAccount
metadata:
  name: mari-flink-job
  namespace: stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mari-flink-job
  namespace: stack
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mari-flink-job
  namespace: stack
subjects:
- kind: ServiceAccount
  name: mari-flink-job
  namespace: stack
roleRef:
  kind: Role
  name: mari-flink-job
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: mari-ingestion
  namespace: stack
spec:
  image: mari-ingestion:local
  flinkVersion: v1_20
  serviceAccount: mari-flink-job
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: '2'
    execution.checkpointing.interval: 15s
    execution.checkpointing.timeout: 2min
    execution.checkpointing.min-pause: 5s
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    state.checkpoints.dir: s3://orchid-local-stack-846199521923-us-east-1/mari/flink/checkpoints
    state.savepoints.dir: s3://orchid-local-stack-846199521923-us-east-1/mari/flink/savepoints
    high-availability.type: kubernetes
    high-availability.storageDir: s3://orchid-local-stack-846199521923-us-east-1/mari/flink/ha
    s3.region: us-east-1
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: '100'
    restart-strategy.fixed-delay.delay: 10s
  jobManager:
    resource:
      memory: 1024m
      cpu: 0.5
  taskManager:
    replicas: 1
    resource:
      memory: 1536m
      cpu: 1
  imagePullPolicy: IfNotPresent
  podTemplate:
    spec:
      containers:
      - name: flink-main-container
        envFrom:
        - secretRef:
            name: aws-credentials
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-kafka-bootstrap:9092
        - name: POLARIS_URI
          value: http://polaris:8181/api/catalog
        - name: POLARIS_CREDENTIAL
          valueFrom:
            secretKeyRef:
              name: polaris
              key: credential
  job:
    jarURI: local:///opt/flink/usrlib/mari-ingestion.jar
    entryClass: local.mari.MariJob
    parallelism: 1
    upgradeMode: savepoint
    state: running

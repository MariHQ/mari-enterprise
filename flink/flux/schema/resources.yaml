apiVersion: batch/v1
kind: Job
metadata:
  name: mari-ingestion-schema
  namespace: stack
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      initContainers:
      - name: register-schemas
        image: mari-app-base:local
        command: [python, -m, apps.base.catalog.register_schemas]
        env:
        - name: SCHEMA_REGISTRY_URL
          value: http://schema-registry.stack.svc:8081
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 256Mi}
      containers:
      - name: schema
        image: mari-ingestion:local
        command:
        - java
        - -cp
        - /opt/flink/usrlib/*:/opt/flink/lib/*
        - local.mari.SchemaApply
        - /opt/mari/ingestion.yaml
        - --apply
        envFrom:
        - secretRef:
            name: mari-runtime
        - secretRef:
            name: aws-credentials
        env:
        - name: SCHEMA_REGISTRY_URL
          value: http://schema-registry.stack.svc:8081
        - name: POLARIS_URI
          value: http://polaris:8181/api/catalog
        - name: POLARIS_CREDENTIAL
          valueFrom:
            secretKeyRef:
              name: polaris
              key: credential
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

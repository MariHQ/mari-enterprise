# Staged defaults; infra/release-local.py resolves images and activates a local OCI release.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mari-topics
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  path: ./flux/topics
  sourceRef:
    kind: GitRepository
    name: mari
  prune: false
  wait: true
  timeout: 5m
  dependsOn:
  - name: kafka
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mari-schema
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  path: ./flink/flux/schema
  sourceRef:
    kind: GitRepository
    name: mari
  dependsOn:
  - name: mari-topics
  - name: bootstrap
  prune: false
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mari-apps
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  path: ./flux/apps
  sourceRef:
    kind: GitRepository
    name: mari
  dependsOn:
  - name: mari-schema
  - name: knative-kourier
  prune: false
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mari-ingestion
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  path: ./flink/flux/job
  sourceRef:
    kind: GitRepository
    name: mari
  dependsOn:
  - name: mari-apps
  prune: false
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mari-temporal
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  path: ./temporal/flux
  sourceRef:
    kind: GitRepository
    name: mari
  dependsOn:
  - name: mari-ingestion
  - name: temporal
  prune: false
  wait: true
  timeout: 10m

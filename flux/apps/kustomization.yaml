apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../apps/overview/flux
- ../../apps/knowledge/flux
- ../../apps/facts/flux
- ../../apps/decisions/flux
- ../../apps/lineage/flux
- ../../apps/workflows/flux
- ../../apps/scheduled-tasks/flux
- ../../apps/publish/flux
- ../../apps/insights/flux
- ../../apps/sources/flux
- ../../apps/settings/flux
- ../../container/flux
configMapGenerator:
- name: mari-app-messaging
  namespace: stack
  literals:
  - KAFKA_BOOTSTRAP_SERVERS=kafka-kafka-bootstrap.stack.svc:9092
configurations:
- knative-config.yaml
patches:
- target:
    group: serving.knative.dev
    version: v1
    kind: Service
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/envFrom/-
      value:
        configMapRef:
          name: mari-app-messaging

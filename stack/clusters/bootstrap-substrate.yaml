apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: stack
  namespace: flux-system
spec:
  interval: 1m
  url: oci://kind-registry:5000/stack/manifests
  ref:
    tag: local
  insecure: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stack
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  path: ./clusters/substrate
  prune: false
  sourceRef:
    kind: OCIRepository
    name: stack
  wait: false

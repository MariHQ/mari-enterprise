apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 30s
  timeout: 10m
  path: ./infrastructure
  prune: false
  sourceRef:
    kind: OCIRepository
    name: stack
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 30s
  timeout: 10m
  path: ./apps/postgres
  prune: false
  sourceRef:
    kind: OCIRepository
    name: stack
  wait: true
  dependsOn:
  - name: infrastructure
---

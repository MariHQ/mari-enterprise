apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- serving-core.yaml
patches:
- patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: config-network
      namespace: knative-serving
    data:
      ingress-class: kourier.ingress.networking.knative.dev
- patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: config-domain
      namespace: knative-serving
    data:
      127.0.0.1.sslip.io: ""

apiVersion: batch/v1
kind: Job
metadata:
  name: configure-stack-v2
  namespace: stack
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: configure
        image: python:3.12-slim-bookworm
        command:
        - python
        - /scripts/configure.py
        env:
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres
              key: password
        - name: POLARIS_SECRET
          valueFrom:
            secretKeyRef:
              name: polaris
              key: client-secret
        - name: S3_BUCKET
          value: orchid-local-stack-846199521923-us-east-1
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: configure-stack

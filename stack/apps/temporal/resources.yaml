apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      enableServiceLinks: false
      containers:
      - name: temporal
        image: temporalio/auto-setup:1.29.1
        ports:
        - containerPort: 7233
        env:
        - name: DB
          value: postgres12
        - name: DB_PORT
          value: '5432'
        - name: POSTGRES_SEEDS
          value: postgres
        - name: POSTGRES_USER
          value: stack
        - name: POSTGRES_PWD
          valueFrom:
            secretKeyRef:
              name: postgres
              key: password
        - name: DBNAME
          value: temporal
        - name: VISIBILITY_DBNAME
          value: temporal_visibility
        - name: SKIP_DB_CREATE
          value: 'true'
        - name: DEFAULT_NAMESPACE
          value: default
        - name: ENABLE_ES
          value: 'false'
        - name: BIND_ON_IP
          value: 0.0.0.0
        - name: PUBLIC_FRONTEND_ADDRESS
          value: temporal:7233
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 7233
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: stack
spec:
  selector:
    app: temporal
  ports:
  - port: 7233
    targetPort: 7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
    spec:
      enableServiceLinks: false
      containers:
      - name: temporal-ui
        image: temporalio/ui:2.43.3
        ports:
        - containerPort: 8080
        env:
        - name: TEMPORAL_ADDRESS
          value: temporal:7233
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: stack
spec:
  selector:
    app: temporal-ui
  ports:
  - port: 8080
    targetPort: 8080

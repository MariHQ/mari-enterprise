apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-dashboard
  template:
    metadata:
      labels:
        app: service-dashboard
    spec:
      containers:
      - name: web
        image: nginxinc/nginx-unprivileged@sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
        volumeMounts:
        - name: content
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: content
          mountPath: /usr/share/nginx/html
          readOnly: true
      volumes:
      - name: content
        configMap:
          name: service-dashboard-content
---
apiVersion: v1
kind: Service
metadata:
  name: service-dashboard
spec:
  type: LoadBalancer
  selector:
    app: service-dashboard
  ports:
  - port: 8085
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui-local
spec:
  type: LoadBalancer
  selector:
    app: temporal-ui
  ports:
  - port: 18000
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: flink-ui-local
spec:
  type: LoadBalancer
  selector:
    app: mari-ingestion
    component: jobmanager
    type: flink-native-kubernetes
  ports:
  - port: 18001
    targetPort: 8081

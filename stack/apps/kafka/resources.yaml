apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: local
  namespace: stack
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 1
  roles:
  - controller
  - broker
  storage:
    type: jbod
    volumes:
    - id: 0
      type: persistent-claim
      size: 5Gi
      deleteClaim: false
      kraftMetadata: shared
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      memory: 1536Mi
  jvmOptions:
    -Xms: 256m
    -Xmx: 512m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: stack
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: true
    readinessProbe:
      initialDelaySeconds: 20
      timeoutSeconds: 5
      failureThreshold: 12
    livenessProbe:
      initialDelaySeconds: 20
      timeoutSeconds: 5
      failureThreshold: 12
  entityOperator:
    topicOperator: {}

apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-bootstrap-v170
  namespace: stack
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        stack-role: polaris-bootstrap
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 185
      restartPolicy: OnFailure
      containers:
      - name: bootstrap
        image: apache/polaris-admin-tool:1.7.0
        command:
        - /bin/sh
        - -ec
        args:
        - exec /opt/jboss/container/java/run/run-java.sh bootstrap --realm=POLARIS
          --credential="$(cat /run/polaris/bootstrap-credential)"
        env:
        - name: POLARIS_PERSISTENCE_TYPE
          value: relational-jdbc
        - name: POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE
          value: postgresql
        - name: QUARKUS_DATASOURCE_JDBC_URL
          value: jdbc:postgresql://postgres:5432/polaris
        - name: QUARKUS_DATASOURCE_USERNAME
          value: stack
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres
              key: password
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: security
          mountPath: /run/polaris
          readOnly: true
      volumes:
      - name: security
        secret:
          secretName: polaris
          defaultMode: 288
---
apiVersion: v1
kind: Service
metadata:
  name: polaris
  namespace: stack
spec:
  selector:
    app: polaris
  ports:
  - name: http
    port: 8181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  namespace: stack
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: polaris
  template:
    metadata:
      labels:
        app: polaris
        stack-role: polaris
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8182'
        prometheus.io/path: /q/metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 185
      terminationGracePeriodSeconds: 60
      containers:
      - name: polaris
        image: apache/polaris:1.7.0
        env:
        - name: POLARIS_PERSISTENCE_TYPE
          value: relational-jdbc
        - name: POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE
          value: postgresql
        - name: QUARKUS_DATASOURCE_JDBC_URL
          value: jdbc:postgresql://postgres:5432/polaris
        - name: QUARKUS_DATASOURCE_USERNAME
          value: stack
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres
              key: password
        - name: POLARIS_REALM_CONTEXT_REALMS
          value: POLARIS
        - name: POLARIS_AUTHENTICATION_TOKEN_BROKER_RSA_KEY_PAIR_PUBLIC_KEY_FILE
          value: /run/polaris/signing.pub
        - name: POLARIS_AUTHENTICATION_TOKEN_BROKER_RSA_KEY_PAIR_PRIVATE_KEY_FILE
          value: /run/polaris/signing.key
        - name: POLARIS_AUTHENTICATION_TOKEN_BROKER_MAX_TOKEN_GENERATION
          value: PT15M
        - name: QUARKUS_OTEL_SDK_DISABLED
          value: 'true'
        - name: JAVA_OPTS_APPEND
          value: -Dpolaris.features.SKIP_CREDENTIAL_SUBSCOPING_INDIRECTION=true
        ports:
        - containerPort: 8181
        - containerPort: 8182
          name: metrics
        resources:
          requests:
            cpu: 100m
            memory: 768Mi
          limits:
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8182
          initialDelaySeconds: 10
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /q/health/started
            port: 8182
          failureThreshold: 40
          periodSeconds: 3
        volumeMounts:
        - name: security
          mountPath: /run/polaris
          readOnly: true
        envFrom:
        - secretRef:
            name: aws-credentials
      volumes:
      - name: security
        secret:
          secretName: polaris
          defaultMode: 288

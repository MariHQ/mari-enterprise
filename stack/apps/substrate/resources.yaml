apiVersion: v1
data:
  otel-collector-config.yaml: "receivers:\n  otlp:\n    protocols:\n      grpc:\n\
    \        endpoint: 0.0.0.0:4317\n      http:\n        endpoint: 0.0.0.0:4318\n\
    processors:\n  batch:\n\n  # The count connector below sends deltas, and the Prometheus\
    \ exporter\n  # reads the new start timestamp of each batch as a reset. Without\n\
    \  # deltatocumulative the counts do not accumulate and each scrape shows\n  #\
    \ only the last batch.\n  #\n  # max_streams bounds the memory. A stream is for\
    \ each process and\n  # count, and not for each service, because serverboot gives\
    \ each\n  # process its own service.instance.id. Above the limit new streams drop\n\
    \  # with no log line and the totals become too low.\n  deltatocumulative:\n \
    \   max_streams: 10000\n\n# The volume of telemetry for each service, the same\
    \ two counts that\n# benchmarking/telemetry/meter.yaml gives on GKE. On GKE the\
    \ managed\n# collector cannot hold a connector, thus a measurement there needs\
    \ a\n# second collector in front of it. Here the collector is ours, thus the\n\
    # counts belong in it and kind needs no meter.\nconnectors:\n  count:\n    spans:\n\
    \      substrate_spans:\n        description: Spans received, by emitting service.\n\
    \        attributes:\n          # The connector reads each key from the attributes\
    \ of the item,\n          # then the scope, then the resource, thus service.name\
    \ resolves\n          # from the resource with no transform in front of it. The\n\
    \          # Prometheus exporter writes the key as service_name.\n          #\n\
    \          # Without a default value the connector removes each item that\n  \
    \        # has no service.name from the count. The item does not show as\n   \
    \       # unknown, and the totals are too low with no error message.\n       \
    \   - key: service.name\n            default_value: unknown\n    datapoints:\n\
    \      substrate_datapoints:\n        description: Metric datapoints received,\
    \ by emitting service.\n        attributes:\n          - key: service.name\n \
    \           default_value: unknown\n\n    # The actor lifecycle events. The key\
    \ is ate.actor.state and not the\n    # event name: the connector reads the attributes\
    \ of the item, and the\n    # event name is a top level field of the record, which\
    \ would need a\n    # transform in front of this. The state is bounded and is\
    \ the more\n    # useful of the two anyway.\n    logs:\n      substrate_actor_state_changes:\n\
    \        description: Actor state change events received, by state.\n        attributes:\n\
    \          - key: service.name\n            default_value: unknown\n         \
    \ # No default: drops workload logs, which have no such key.\n          - key:\
    \ ate.actor.state\n\nexporters:\n  otlp/jaeger:\n    endpoint: jaeger.otel-system.svc.cluster.local:4317\n\
    \    tls:\n      insecure: true\n  prometheus:\n    endpoint: 0.0.0.0:8889\n \
    \ debug:\n    verbosity: detailed\nservice:\n  pipelines:\n    traces:\n     \
    \ receivers: [otlp]\n      processors: [batch]\n      exporters: [otlp/jaeger,\
    \ debug]\n    metrics:\n      receivers: [otlp]\n      processors: [batch]\n \
    \     exporters: [prometheus, debug]\n\n    # Every ate event, plus any workload\
    \ that sends OTLP logs. debug is the\n    # only exporter: kind has no log store,\
    \ and the e2e read-back goes\n    # through the count connector below. Never put\
    \ a sampler or a filter\n    # here. A consumer takes the last event for an actor,\
    \ thus a dropped\n    # record reports a stale state with no sign that anything\
    \ is missing.\n    logs:\n      receivers: [otlp]\n      processors: [batch]\n\
    \      exporters: [debug]\n\n    # The count pipelines read the same receiver\
    \ as the pipelines above,\n    # and they only count. The connector declares MutatesData\
    \ false, thus\n    # it changes nothing that reaches Jaeger or Prometheus.\n \
    \   traces/count:\n      receivers: [otlp]\n      exporters: [count]\n    metrics/count:\n\
    \      receivers: [otlp]\n      exporters: [count]\n    logs/count:\n      receivers:\
    \ [otlp]\n      exporters: [count]\n\n    # The counts that the connector makes,\
    \ out to the Prometheus exporter.\n    metrics/count-out:\n      receivers: [count]\n\
    \      processors: [deltatocumulative]\n      exporters: [prometheus]\n\n  # The\
    \ otelcol_* counters of the collector itself. A service that reports\n  # zero\
    \ volume gives no data by itself: otelcol_receiver_accepted_* shows\n  # the difference\
    \ between a service that sent nothing and data that never\n  # arrived. The default\
    \ reader binds to localhost, thus give the address\n  # of each interface so the\
    \ Prometheus pod can reach it.\n  #\n  # The level stays at the default. It already\
    \ gives each counter above,\n  # and detailed adds histograms only, which no query\
    \ here reads.\n  telemetry:\n    metrics:\n      readers:\n        - pull:\n \
    \           exporter:\n              prometheus:\n                host: 0.0.0.0\n\
    \                port: 8888\n"
kind: ConfigMap
metadata:
  annotations: {}
  name: opentelemetry-collector-config
  namespace: otel-system
---
apiVersion: v1
data:
  prometheus.yml: "# The kubernetes-pods scrape job below is adapted from the\n# prometheus-community\
    \ Helm chart's job of the same name:\n# https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus/values.yaml\n\
    global:\n  scrape_interval: 15s\nscrape_configs:\n  - job_name: kubernetes-pods\n\
    \    kubernetes_sd_configs:\n      - role: pod\n        namespaces:\n        \
    \  names:\n            - ate-system\n            - otel-system\n    relabel_configs:\n\
    \      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]\n\
    \        action: keep\n        regex: \"true\"\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]\n\
    \        action: replace\n        target_label: __metrics_path__\n        regex:\
    \ (.+)\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port,\
    \ __meta_kubernetes_pod_ip]\n        action: replace\n        regex: (\\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})\n\
    \        replacement: '[$2]:$1'\n        target_label: __address__\n      - source_labels:\
    \ [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]\n\
    \        action: replace\n        regex: (\\d+);((([0-9]+?)(\\.|$)){4})\n    \
    \    replacement: $2:$1\n        target_label: __address__\n      - action: labelmap\n\
    \        regex: __meta_kubernetes_pod_label_(.+)\n      - source_labels: [__meta_kubernetes_namespace]\n\
    \        action: replace\n        target_label: namespace\n      - source_labels:\
    \ [__meta_kubernetes_pod_name]\n        action: replace\n        target_label:\
    \ pod\n      - source_labels: [__meta_kubernetes_pod_node_name]\n        action:\
    \ replace\n        target_label: node\n      - source_labels: [__meta_kubernetes_pod_phase]\n\
    \        action: drop\n        regex: Pending|Succeeded|Failed\n\n  # The two\
    \ read ports of the collector: 8889 carries the substrate_*\n  # counts of the\
    \ count connector, and 8888 the otelcol_* counters of the\n  # collector itself.\
    \ The two go together: when a service reports zero\n  # volume, otelcol_receiver_accepted_*\
    \ shows the difference between a\n  # service that sent nothing and data that\
    \ never arrived.\n  #\n  # This job, and not the annotation job above, reads the\
    \ collector. The\n  # annotation can name one port only, thus the collector pod\
    \ carries no\n  # prometheus.io/scrape annotation. Read the two ports here instead.\n\
    \  #\n  # 8889 re-exports each metric that the pipelines push, and the pods of\n\
    \  # ate-api-server, atelet, and atenet-router already carry the annotation\n\
    \  # on 9090. Keep the substrate_* and otelcol_* names only, or every\n  # series\
    \ of those services arrives twice and sum() gives double.\n  - job_name: otel-collector-self\n\
    \    kubernetes_sd_configs:\n      - role: pod\n        namespaces:\n        \
    \  names:\n            - otel-system\n    relabel_configs:\n      - source_labels:\n\
    \          - __meta_kubernetes_pod_label_app\n          - __meta_kubernetes_pod_container_port_number\n\
    \        action: keep\n        regex: opentelemetry-collector;(8888|8889)\n  \
    \    - source_labels: [__meta_kubernetes_pod_name]\n        action: replace\n\
    \        target_label: pod\n      - source_labels: [__meta_kubernetes_namespace]\n\
    \        action: replace\n        target_label: namespace\n    metric_relabel_configs:\n\
    \      - source_labels: [__name__]\n        action: keep\n        regex: (substrate|otelcol)_.*\n"
kind: ConfigMap
metadata:
  annotations: {}
  name: prometheus-config
  namespace: otel-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations: {}
  name: prometheus
  namespace: otel-system
---

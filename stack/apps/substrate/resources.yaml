apiVersion: v1
data:
  envoy.yaml: "admin:\n  address:\n    socket_address:\n      # ipv4_compat keeps\
    \ `kubectl port-forward` to the admin port working;\n      # in-pod callers dial\
    \ localhost and need no help.\n      address: \"::\"\n      ipv4_compat: true\n\
    \      port_value: 9901\n\nnode:\n  id: substrate-envoy-node\n  cluster: substrate-router-cluster\n\
    \n# Required for main_internal (see xds.go's buildMainInternalListener):\n# Envoy\
    \ rejects any Listener.internal_listener without this registered,\n# with \"InternalListener\
    \ bootstrap extension is mandatory\".\nbootstrap_extensions:\n- name: envoy.bootstrap.internal_listener\n\
    \  typed_config:\n    \"@type\": type.googleapis.com/envoy.extensions.bootstrap.internal_listener.v3.InternalListener\n\
    \ndynamic_resources:\n  lds_config:\n    resource_api_version: V3\n    ads: {}\n\
    \  cds_config:\n    resource_api_version: V3\n    ads: {}\n  ads_config:\n   \
    \ api_type: GRPC\n    transport_api_version: V3\n    grpc_services:\n    - envoy_grpc:\n\
    \        cluster_name: xds_cluster\n\nstatic_resources:\n  clusters:\n  - name:\
    \ xds_cluster\n    connect_timeout: 0.25s\n    type: STRICT_DNS\n    lb_policy:\
    \ ROUND_ROBIN\n    typed_extension_protocol_options:\n      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:\n\
    \        \"@type\": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions\n\
    \        explicit_http_config:\n          http2_protocol_options: {}\n    load_assignment:\n\
    \      cluster_name: xds_cluster\n      endpoints:\n      - lb_endpoints:\n  \
    \      - endpoint:\n            address:\n              socket_address:\n    \
    \            address: 127.0.0.1\n                port_value: 18000\n"

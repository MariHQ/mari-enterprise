        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        envFrom:
        - configMapRef:
            name: ate-otel-config
        image: localhost:5001/atecontroller-86b02a85c6bff82898e0930a8b0286d1@sha256:fa686afa29bef8c539a92d400f9a9439f8b96ef7ce8ec6c3a3c145d893d162d9
        name: ate-controller
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: healthz
          protocol: TCP
        volumeMounts:
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
        - mountPath: /run/servicedns-ca
          name: servicedns-ca
      serviceAccountName: ate-controller
      volumes:
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: podidentity.podcert.ate.dev/identity
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity

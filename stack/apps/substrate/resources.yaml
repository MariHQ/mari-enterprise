metadata:
  annotations: {}
  name: ate-prometheus
  namespace: otel-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ate-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: otel-system

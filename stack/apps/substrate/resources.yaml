apiVersion: v1
data:
  pg_hba.conf: '# Local socket access is limited to processes in this pod and is used
    by

    # health checks, the workload''s idempotent database bootstrap, and the

    # tls-reloader sidecar''s configuration reloads.

    local all all trust

    # PostgreSQL verifies client certificates against the pod-identity CA. It

    # does not need its own serving CA because it never verifies its server certificate.

    hostssl all all all trust clientcert=verify-ca

    '
  postgresql.conf: 'listen_addresses = ''*''

    ssl = on

    ssl_cert_file = ''/run/servicedns.podcert.ate.dev/credential-bundle.pem''

    ssl_key_file = ''/run/servicedns.podcert.ate.dev/credential-bundle.pem''

    ssl_ca_file = ''/run/podidentity.podcert.ate.dev/trust-bundle.pem''

    hba_file = ''/etc/postgresql/pg_hba.conf''

    '
  reload-tls.sh: "# PostgreSQL opens ssl_cert_file, ssl_key_file and ssl_ca_file at\
    \ startup\n# and on SIGHUP, and nowhere else. The kubelet replaces the projected\
    \ pod\n# certificate in place about 30 minutes before it expires, so without this\n\
    # loop the server keeps presenting the certificate it booted with until it\n#\
    \ expires about a day later and every client stops trusting it.\nset -eu\n\n#\
    \ As PID 1 this shell only sees SIGTERM if a handler is installed, and only\n\
    # acts on it between commands, so the sleep below runs in the background\n# and\
    \ is waited on. Without both halves the pod takes the full termination\n# grace\
    \ period to go away.\ntrap 'exit 0' TERM INT\n\nCERT=/run/servicedns.podcert.ate.dev/credential-bundle.pem\n\
    CA=/run/podidentity.podcert.ate.dev/trust-bundle.pem\n\n# Comfortably inside the\
    \ 30m headroom (notAfter - beginRefreshAt) that\n# cmd/podcertcontroller/internal/servicednssigner/servicednssigner.go\n\
    # leaves; hashing two small files costs nothing.\nINTERVAL=60\n\nreloaded=\"\"\
    \nwhile true; do\n  current=\"$(sha256sum \"${CERT}\" \"${CA}\")\"\n  # Reloading\
    \ fails until the server is accepting connections, which is\n  # where every pod\
    \ starts out, so only record a hash once it has worked.\n  # Starting empty also\
    \ means a restart of this container costs one\n  # redundant reload rather than\
    \ a missed one.\n  if [ \"${current}\" != \"${reloaded}\" ] \\\n    && psql -U\
    \ postgres -d postgres -Atc 'SELECT pg_reload_conf()' >/dev/null 2>&1; then\n\
    \    reloaded=\"${current}\"\n    echo \"$(date -u +%FT%TZ) reloaded TLS configuration\"\
    \n  fi\n  sleep \"${INTERVAL}\" &\n  wait $!\ndone\n"

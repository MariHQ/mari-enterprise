name: Component tests

# Reusable component packages remain independent of application persistence.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  components:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vendor/mari-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vendor/mari-kit/packages/*/pyproject.toml
      - run: python -m pip install packages/*
      - run: |
          python -m unittest discover -s tests -v
          for package in packages/*; do
            if [ -d "$package/tests" ]; then
              python -m unittest discover -s "$package/tests" -v
            fi
          done

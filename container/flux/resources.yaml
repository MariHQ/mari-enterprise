apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mari-container
  namespace: stack
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: '1'
    spec:
      containers:
      - image: mari-container:local
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: mari-runtime

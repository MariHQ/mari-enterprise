<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* LinkedIn company page cover — official spec: 4200×700, 6:1, PNG/JPG < 3MB.
     Authored at 2100×350, rendered at 2× = 4200×700.
     LinkedIn trims covers per screen, so the lockup is CENTERED (its guidance:
     "position important information in the center", "limited text"). Tagline
     goes in LinkedIn's own Tagline field, not on the banner. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1128px; height:191px; }
  .stage { width:1128px; height:191px; position:relative; background:#ffffff; overflow:hidden;
           font-family:Inter, sans-serif; -webkit-font-smoothing:antialiased; display:grid; place-items:center; }
  .dots { position:absolute; inset:0;
    background-image:radial-gradient(rgba(16,38,59,.09) 1.4px, transparent 1.7px);
    background-size:22px 22px; }
  .frame { position:absolute; inset:12px; border:1px solid rgba(16,38,59,.26); }
  .rust  { position:absolute; top:22px; right:22px; width:5px; height:40px; background:#B23A1E; }
  .lockup { position:relative; z-index:1; display:flex; align-items:center; gap:14px; }
  .lockup svg { display:block; }
  .word { font-weight:800; font-size:72px; letter-spacing:-.03em; color:#10263B; line-height:.9; }
</style></head>
<body>
  <div class="stage">
    <div class="dots"></div>
    <div class="frame"></div>
    <div class="rust"></div>
    <div class="lockup">
      <svg width="72" height="72" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="30" height="30" fill="#ffffff" stroke="#10263B" stroke-width="2"/>
        <path d="M7 25V9l9 9 9-9v16" fill="none" stroke="#10263B" stroke-width="2.4" stroke-linejoin="miter"/>
        <rect x="5" y="7" width="4" height="4" fill="#10263B"/><rect x="23" y="7" width="4" height="4" fill="#10263B"/>
        <rect x="5" y="23" width="4" height="4" fill="#10263B"/><rect x="23" y="23" width="4" height="4" fill="#10263B"/>
        <rect x="14" y="16" width="4" height="4" fill="#1C3F60"/>
      </svg>
      <span class="word">mari</span>
    </div>
  </div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1584px; height:396px; }
  .stage { width:1584px; height:396px; position:relative; background:#ffffff; overflow:hidden;
           font-family:Inter, sans-serif; -webkit-font-smoothing:antialiased; }
  .dots { position:absolute; inset:0;
    background-image:radial-gradient(rgba(16,38,59,.09) 1.3px, transparent 1.5px);
    background-size:26px 26px; }
  .frame { position:absolute; inset:20px; border:1px solid rgba(16,38,59,.26); }
  .rust  { position:absolute; top:20px; right:20px; width:7px; height:62px; background:#B23A1E; }
  .br { position:absolute; bottom:40px; right:52px;
        font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:500; letter-spacing:.26em; color:#9AA7B4; }
  /* Profile photo bubble sits lower-left — keep everything right of x≈300 */
  .safe { position:absolute; left:520px; right:70px; top:0; bottom:0;
          display:flex; flex-direction:column; justify-content:center; gap:26px; }
  .kicker { display:flex; align-items:center; gap:11px;
            font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:500; letter-spacing:.2em; color:#B23A1E; }
  .kicker i { width:9px; height:9px; background:#B23A1E; }
  .lockup { display:flex; align-items:center; gap:18px; }
  .lockup svg { display:block; }
  .word { font-weight:800; font-size:84px; letter-spacing:-.03em; color:#10263B; line-height:.9; }
  .head { font-weight:800; font-size:54px; letter-spacing:-.02em; color:#1C3F60; line-height:1.08; }
</style></head>
<body>
  <div class="stage">
    <div class="dots"></div>
    <div class="frame"></div>
    <div class="rust"></div>
    <div class="safe">
      <div class="kicker"><i></i>DOCS WITH RECEIPTS</div>
      <div class="lockup">
        <svg width="88" height="88" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="30" height="30" fill="#ffffff" stroke="#10263B" stroke-width="2"/>
          <path d="M7 25V9l9 9 9-9v16" fill="none" stroke="#10263B" stroke-width="2.4" stroke-linejoin="miter"/>
          <rect x="5" y="7" width="4" height="4" fill="#10263B"/><rect x="23" y="7" width="4" height="4" fill="#10263B"/>
          <rect x="5" y="23" width="4" height="4" fill="#10263B"/><rect x="23" y="23" width="4" height="4" fill="#10263B"/>
          <rect x="14" y="16" width="4" height="4" fill="#1C3F60"/>
        </svg>
        <span class="word">mari</span>
      </div>
      <div class="head">Claim-checking for AI coding agents</div>
    </div>
    <div class="br">MARI.GURU</div>
  </div>
</body></html>

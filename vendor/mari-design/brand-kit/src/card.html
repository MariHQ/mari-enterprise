<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  .stage { width:1200px; height:630px; position:relative; background:#ffffff; overflow:hidden;
           font-family:Inter, sans-serif; -webkit-font-smoothing:antialiased; }
  .dots { position:absolute; inset:0;
    background-image:radial-gradient(rgba(16,38,59,.09) 1.3px, transparent 1.5px);
    background-size:26px 26px; }
  .frame { position:absolute; inset:22px; border:1px solid rgba(16,38,59,.28); }
  .rust  { position:absolute; top:22px; right:22px; width:7px; height:70px; background:#B23A1E; }
  .tl { position:absolute; top:46px; left:56px; display:flex; align-items:center; gap:11px;
        font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:500; letter-spacing:.18em; color:#10263B; }
  .tl i { width:11px; height:11px; background:#10263B; }
  .br { position:absolute; bottom:44px; right:56px;
        font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:500; letter-spacing:.28em; color:#9AA7B4; }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; }
  .lockup { display:flex; align-items:center; gap:26px; }
  .lockup svg { display:block; }
  .word { font-weight:800; font-size:112px; letter-spacing:-.03em; color:#10263B; line-height:.9; }
  .head { font-weight:800; font-size:60px; letter-spacing:-.02em; color:#1C3F60; text-align:center; line-height:1.05; }
</style></head>
<body>
  <div class="stage">
    <div class="dots"></div>
    <div class="frame"></div>
    <div class="rust"></div>
    <div class="tl"><i></i>MARI.GURU</div>
    <div class="center">
      <div class="lockup">
        <svg width="118" height="118" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="30" height="30" fill="#ffffff" stroke="#10263B" stroke-width="2"/>
          <path d="M7 25V9l9 9 9-9v16" fill="none" stroke="#10263B" stroke-width="2.4" stroke-linejoin="miter"/>
          <rect x="5" y="7" width="4" height="4" fill="#10263B"/><rect x="23" y="7" width="4" height="4" fill="#10263B"/>
          <rect x="5" y="23" width="4" height="4" fill="#10263B"/><rect x="23" y="23" width="4" height="4" fill="#10263B"/>
          <rect x="14" y="16" width="4" height="4" fill="#1C3F60"/>
        </svg>
        <span class="word">mari</span>
      </div>
      <div class="head">Claim-checking for AI coding agents</div>
    </div>
    <div class="br">DOCS WITH RECEIPTS</div>
  </div>
</body></html>

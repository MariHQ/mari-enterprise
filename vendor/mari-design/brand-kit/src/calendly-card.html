<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Calendly link card, 1200x630 (standard link-preview size).
     Attach it wherever the Calendly link is shared. Big type only. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  .stage { width:1200px; height:630px; position:relative; background:#ffffff; overflow:hidden;
           font-family:Inter, sans-serif; -webkit-font-smoothing:antialiased;
           display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; }
  .dots { position:absolute; inset:0;
    background-image:radial-gradient(rgba(16,38,59,.09) 1.3px, transparent 1.5px);
    background-size:26px 26px; }
  .frame { position:absolute; inset:22px; border:1px solid rgba(16,38,59,.28); }
  .rust  { position:absolute; top:22px; right:22px; width:7px; height:70px; background:#B23A1E; }
  .kicker { position:relative; display:flex; align-items:center; gap:12px;
            font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:500; letter-spacing:.24em; color:#B23A1E; }
  .kicker i { width:11px; height:11px; background:#B23A1E; }
  .lockup { position:relative; display:flex; align-items:center; gap:24px; }
  .word { font-weight:800; font-size:104px; letter-spacing:-.03em; color:#10263B; line-height:.9; }
  .head { position:relative; font-weight:800; font-size:44px; letter-spacing:-.02em; color:#1C3F60; }
  .btn { position:relative; background:#10263B; color:#ffffff; font-weight:700; font-size:30px;
         padding:20px 44px; box-shadow:5px 5px 0 rgba(16,38,59,.25); }
</style></head>
<body>
  <div class="stage">
    <div class="dots"></div>
    <div class="frame"></div>
    <div class="rust"></div>
    <div class="kicker"><i></i>DOCS WITH RECEIPTS</div>
    <div class="lockup">
      <svg width="110" height="110" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="30" height="30" fill="#ffffff" stroke="#10263B" stroke-width="2"/>
        <path d="M7 25V9l9 9 9-9v16" fill="none" stroke="#10263B" stroke-width="2.4" stroke-linejoin="miter"/>
        <rect x="5" y="7" width="4" height="4" fill="#10263B"/><rect x="23" y="7" width="4" height="4" fill="#10263B"/>
        <rect x="5" y="23" width="4" height="4" fill="#10263B"/><rect x="23" y="23" width="4" height="4" fill="#10263B"/>
        <rect x="14" y="16" width="4" height="4" fill="#1C3F60"/>
      </svg>
      <span class="word">mari</span>
    </div>
    <div class="head">Claim-checking for AI coding agents</div>
    <div class="btn">Book time with Mari</div>
  </div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:400px; height:400px; }
  .stage {
    width:400px; height:400px; position:relative; background:#ffffff; overflow:hidden;
    font-family:Inter, sans-serif;
  }
  .dots {
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(16,38,59,.10) 1.2px, transparent 1.4px);
    background-size:22px 22px; background-position:0 0;
  }
  .frame { position:absolute; inset:14px; border:1px solid rgba(16,38,59,.30); }
  .center { position:absolute; inset:0; display:grid; place-items:center; }
  svg { display:block; }
</style></head>
<body>
  <div class="stage">
    <div class="dots"></div>
    <div class="frame"></div>
    <div class="center">
      <svg width="208" height="208" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="30" height="30" fill="#ffffff" stroke="#10263B" stroke-width="2"/>
        <path d="M7 25V9l9 9 9-9v16" fill="none" stroke="#10263B" stroke-width="2.4" stroke-linejoin="miter"/>
        <rect x="5" y="7" width="4" height="4" fill="#10263B"/>
        <rect x="23" y="7" width="4" height="4" fill="#10263B"/>
        <rect x="5" y="23" width="4" height="4" fill="#10263B"/>
        <rect x="23" y="23" width="4" height="4" fill="#10263B"/>
        <rect x="14" y="16" width="4" height="4" fill="#1C3F60"/>
      </svg>
    </div>
  </div>
</body></html>

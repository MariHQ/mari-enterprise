<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Render frame</title>
    <style>
      /* Animation freeze for stable screenshots is injected by render.tsx only
         when NOT in &full=1 mode, so the live full-screen view stays animated. */
      html, body, #root { height: 100%; margin: 0; }
      body { background: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./render.tsx"></script>
  </body>
</html>

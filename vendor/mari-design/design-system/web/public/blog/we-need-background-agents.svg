<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Background agents">
  <defs>
    <linearGradient id="bg-bgagents" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f4c75"></stop>
      <stop offset="100%" stop-color="#1c5d8a"></stop>
    </linearGradient>
    <pattern id="grid-bgagents" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fdfaf6" stroke-opacity="0.06" stroke-width="1"></path>
    </pattern>
    <filter id="rough-bgagents">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="2.5"></feDisplacementMap>
    </filter>
    <radialGradient id="moon-bgagents" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#fef9c3"></stop>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg-bgagents)"></rect>

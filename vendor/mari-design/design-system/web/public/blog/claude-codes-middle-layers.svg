<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="The middle three layers">
  <defs>
    <linearGradient id="bg-mid3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfaf6"></stop>
      <stop offset="50%" stop-color="#fef3c7"></stop>
      <stop offset="100%" stop-color="#fbcfe8"></stop>
    </linearGradient>
    <pattern id="paper-mid3" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#0f4c75" stroke-opacity="0.045" stroke-width="1"></path>
    </pattern>
    <filter id="rough-mid3">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="1.6"></feDisplacementMap>
    </filter>
    <filter id="soft-mid3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#0f4c75" flood-opacity="0.14"></feDropShadow>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg-mid3)"></rect>
  <rect width="600" height="600" fill="url(#paper-mid3)"></rect>

  
  <g filter="url(#soft-mid3)">
    
    <g filter="url(#rough-mid3)">
      <rect x="100" y="120" width="400" height="58" rx="6" fill="#e2e8f0" stroke="#0f4c75" stroke-width="2.4"></rect>
    </g>
    
    <g transform="translate(140 149)" stroke="#0f4c75" stroke-width="2" fill="none" filter="url(#rough-mid3)">
      <circle cx="0" cy="0" r="11"></circle>
      <circle cx="0" cy="0" r="3.5" fill="#0f4c75"></circle>
      <line x1="0" y1="-15" x2="0" y2="-11"></line>
      <line x1="0" y1="11" x2="0" y2="15"></line>
      <line x1="-15" y1="0" x2="-11" y2="0"></line>
      <line x1="11" y1="0" x2="15" y2="0"></line>
      <line x1="-10.6" y1="-10.6" x2="-7.8" y2="-7.8"></line>
      <line x1="7.8" y1="7.8" x2="10.6" y2="10.6"></line>
      <line x1="-10.6" y1="10.6" x2="-7.8" y2="7.8"></line>
      <line x1="7.8" y1="-7.8" x2="10.6" y2="-10.6"></line>
    </g>

    
    <rect x="100" y="190" width="400" height="58" rx="6" fill="#fdfaf6" stroke="#0f4c75" stroke-width="2.6"></rect>
    <g stroke="#0f4c75" stroke-width="1.4" stroke-linecap="round" filter="url(#rough-mid3)" opacity="0.7">
      <line x1="160" y1="208" x2="290" y2="208"></line>
      <line x1="160" y1="220" x2="320" y2="220"></line>
      <line x1="160" y1="232" x2="270" y2="232"></line>
    </g>

    
    <rect x="100" y="260" width="400" height="58" rx="6" fill="#e2e8f0" stroke="#0f4c75" stroke-width="2.4"></rect>
    <g transform="translate(140 289)" stroke="#0f4c75" stroke-width="2" fill="none" filter="url(#rough-mid3)" stroke-linecap="round">
      <path d="M-12 -6 L0 0 L-12 6"></path>
      <path d="M-3 -6 L9 0 L-3 6"></path>
    </g>

    
    <rect x="100" y="330" width="400" height="58" rx="6" fill="#fdfaf6" stroke="#0f4c75" stroke-width="2.6"></rect>
    <g stroke="#0f4c75" stroke-width="1.4" stroke-linecap="round" filter="url(#rough-mid3)" opacity="0.7">
      <line x1="160" y1="348" x2="280" y2="348"></line>
      <line x1="160" y1="360" x2="320" y2="360"></line>
      <line x1="160" y1="372" x2="240" y2="372"></line>
    </g>

    
    <rect x="100" y="400" width="400" height="58" rx="6" fill="#fdfaf6" stroke="#0f4c75" stroke-width="2.6"></rect>
    <g stroke="#0f4c75" stroke-width="1.4" stroke-linecap="round" filter="url(#rough-mid3)" opacity="0.7">
      <line x1="160" y1="418" x2="290" y2="418"></line>
      <line x1="160" y1="430" x2="310" y2="430"></line>
      <line x1="160" y1="442" x2="250" y2="442"></line>
    </g>
  </g>

  
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#0f4c75" opacity="0.7" letter-spacing="1">
    <text x="60" y="155" text-anchor="end">5</text>
    <text x="60" y="225" text-anchor="end">4</text>
    <text x="60" y="295" text-anchor="end">3</text>
    <text x="60" y="365" text-anchor="end">2</text>
    <text x="60" y="435" text-anchor="end">1</text>
  </g>

  
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0f4c75">
    <text x="515" y="155" opacity="0.55">plugins</text>
    <text x="515" y="225" font-weight="700">delegation</text>
    <text x="515" y="295" opacity="0.55">hooks</text>
    <text x="515" y="365" font-weight="700">knowledge</text>
    <text x="515" y="435" font-weight="700">memory</text>
  </g>

  
  <g stroke="#b91c1c" stroke-width="2.4" fill="none" stroke-linecap="round" filter="url(#rough-mid3)">
    <path d="M88 195 L78 195 L78 458 L88 458"></path>
    <path d="M82 326 L70 326"></path>
  </g>
  <g font-family="ui-serif, Georgia, serif" font-style="italic" fill="#b91c1c">
    <text x="40" y="318" font-size="14" text-anchor="end" transform="rotate(-90 40 318)">documents</text>
  </g>

  
  <g font-family="ui-serif, Georgia, serif" font-style="italic" fill="#0f4c75">
    <text x="60" y="82" font-size="29" font-weight="700">the middle three layers</text>
    <text x="60" y="540" font-size="20" opacity="0.82">memory · knowledge · delegation</text>
  </g>
  <text x="60" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0f4c75" opacity="0.48" letter-spacing="2">DOCUMENTS DO NOT MAINTAIN THEMSELVES</text>
</svg>
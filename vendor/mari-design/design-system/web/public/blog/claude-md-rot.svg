<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-label="CLAUDE.md goes stale past the 200-line ceiling">
  <defs>
    <linearGradient id="bg-rot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfaf6"></stop>
      <stop offset="100%" stop-color="#fde68a"></stop>
    </linearGradient>
    <pattern id="paper-rot" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#0f4c75" stroke-opacity="0.05" stroke-width="1"></path>
    </pattern>
    <filter id="rough-rot">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="6"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="1.5"></feDisplacementMap>
    </filter>
    <filter id="soft-rot" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f4c75" flood-opacity="0.13"></feDropShadow>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bg-rot)"></rect>
  <rect width="600" height="360" fill="url(#paper-rot)"></rect>

  
  <g font-family="ui-serif, Georgia, serif" font-style="italic" fill="#0f4c75">
    <text x="40" y="46" font-size="22" font-weight="700">CLAUDE.md, week 12</text>
  </g>
  <text x="40" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#0f4c75" opacity="0.65" letter-spacing="1">no linter · no diff · no expiry</text>

  
  <g filter="url(#soft-rot)">
    <path d="M220 90 H410 L450 130 V330 H220 Z" fill="#fdfaf6" stroke="#0f4c75" stroke-width="2.6"></path>
    <path d="M410 90 V130 H450" fill="#fef3c7" stroke="#0f4c75" stroke-width="2.6"></path>
  </g>

  
  <g stroke="#0f4c75" stroke-width="1.5" stroke-linecap="round" filter="url(#rough-rot)" opacity="0.85">
    <line x1="240" y1="148" x2="390" y2="148"></line>
    <line x1="240" y1="166" x2="420" y2="166"></line>
    <line x1="240" y1="184" x2="370" y2="184"></line>
    <line x1="240" y1="202" x2="410" y2="202"></line>
  </g>

  
  <g stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5" fill="none" filter="url(#rough-rot)">
    <line x1="210" y1="222" x2="460" y2="222"></line>
  </g>
  <text x="466" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#b91c1c" font-weight="700">~200 lines</text>

  
  <g stroke="#0f4c75" stroke-width="1.5" stroke-linecap="round" filter="url(#rough-rot)" opacity="0.35">
    <line x1="240" y1="244" x2="380" y2="244"></line>
    <line x1="240" y1="262" x2="410" y2="262"></line>
    <line x1="240" y1="280" x2="360" y2="280"></line>
    <line x1="240" y1="298" x2="395" y2="298"></line>
  </g>
  
  <g stroke="#b91c1c" stroke-width="2" stroke-linecap="round" filter="url(#rough-rot)" opacity="0.85">
    <line x1="236" y1="244" x2="384" y2="244"></line>
    <line x1="236" y1="280" x2="364" y2="280"></line>
  </g>

  
  <g font-family="ui-serif, Georgia, serif" font-style="italic" fill="#b91c1c">
    <text x="40" y="266" font-size="14">claude stops</text>
    <text x="40" y="284" font-size="14">reading here</text>
  </g>
  <g stroke="#b91c1c" stroke-width="1.8" fill="none" stroke-linecap="round" filter="url(#rough-rot)">
    <path d="M150 270 C 180 268, 200 260, 218 248"></path>
    <polyline points="212 244, 219 247, 217 254"></polyline>
  </g>
</svg>
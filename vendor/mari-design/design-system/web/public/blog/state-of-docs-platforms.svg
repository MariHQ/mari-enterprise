<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="The state of docs platforms">
  <defs>
    <linearGradient id="bg-platforms" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"></stop>
      <stop offset="100%" stop-color="#fdfaf6"></stop>
    </linearGradient>
    <filter id="rough-platforms">
      <feTurbulence type="fractalNoise" baseFrequency="1.0" numOctaves="2" seed="7"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="1.8"></feDisplacementMap>
    </filter>
    <pattern id="paper-platforms" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#0f4c75" fill-opacity="0.05"></circle>
    </pattern>
  </defs>

  <rect width="600" height="600" fill="url(#bg-platforms)"></rect>
  <rect width="600" height="600" fill="url(#paper-platforms)"></rect>

  
  <g stroke="#0f4c75" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#rough-platforms)">
    <line x1="80" y1="500" x2="540" y2="500"></line>
    <line x1="80" y1="500" x2="80" y2="100"></line>
    
    <line x1="78" y1="440" x2="86" y2="440"></line>
    <line x1="78" y1="370" x2="86" y2="370"></line>
    <line x1="78" y1="300" x2="86" y2="300"></line>
    <line x1="78" y1="230" x2="86" y2="230"></line>
    <line x1="78" y1="160" x2="86" y2="160"></line>
  </g>

  
  <g filter="url(#rough-platforms)">
    <rect x="135" y="320" width="70" height="180" fill="#0f4c75" fill-opacity="0.18" stroke="#0f4c75" stroke-width="2"></rect>
    <text x="170" y="525" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-style="italic" font-size="15" fill="#0f4c75">mintlify</text>
  </g>

  
  <g filter="url(#rough-platforms)">
    <rect x="245" y="350" width="70" height="150" fill="#0f4c75" fill-opacity="0.18" stroke="#0f4c75" stroke-width="2"></rect>
    <text x="280" y="525" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-style="italic" font-size="15" fill="#0f4c75">fern</text>
  </g>

  
  <g filter="url(#rough-platforms)">
    <rect x="355" y="370" width="70" height="130" fill="#0f4c75" fill-opacity="0.12" stroke="#0f4c75" stroke-width="2" stroke-dasharray="4 4"></rect>
    <text x="390" y="525" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-style="italic" font-size="14" fill="#0f4c75" opacity="0.7">others</text>
  </g>

  
  <g filter="url(#rough-platforms)">
    <rect x="465" y="160" width="70" height="340" fill="#0f4c75" stroke="#072a45" stroke-width="2.5"></rect>
    <text x="500" y="525" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-style="italic" font-weight="700" font-size="17" fill="#0f4c75">mari</text>
  </g>

  
  <g stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#rough-platforms)">
    <path d="M390 130 C 420 110, 450 130, 470 165"></path>
    <polyline points="462 152, 472 167, 456 168"></polyline>
  </g>
  <text x="220" y="120" font-family="ui-serif, Georgia, serif" font-style="italic" font-size="22" fill="#b91c1c">us, soon enough</text>

  
  <text x="20" y="300" font-family="ui-serif, Georgia, serif" font-style="italic" font-size="14" fill="#0f4c75" opacity="0.7" transform="rotate(-90 20 300)">feature coverage</text>

  
  <g stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough-platforms)">
    <polyline points="490 200, 498 210, 514 188"></polyline>
    <polyline points="490 250, 498 260, 514 238"></polyline>
    <polyline points="490 300, 498 310, 514 288"></polyline>
    <polyline points="490 350, 498 360, 514 338"></polyline>
    <polyline points="490 400, 498 410, 514 388"></polyline>
    <polyline points="490 450, 498 460, 514 438"></polyline>
  </g>

  
  <text x="80" y="70" font-family="ui-serif, Georgia, serif" font-style="italic" font-size="28" font-weight="600" fill="#0f4c75">the state of docs platforms</text>
  <line x1="82" y1="80" x2="445" y2="84" stroke="#0f4c75" stroke-width="1.5" opacity="0.4" filter="url(#rough-platforms)"></line>
</svg>
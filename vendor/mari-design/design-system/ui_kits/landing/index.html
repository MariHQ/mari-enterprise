<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mari — Landing UI kit</title>
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="../_kit.css">
<style>
  body { min-height: 100vh; }
  /* surface-3 fallback (sand-1 in design system) */
  :root { --surface-3: 30 18% 86%; }
  footer { padding: 64px 0 48px; border-top: 1px solid hsl(var(--border) / 0.6);
           color: hsl(var(--muted-foreground)); font-size: 13px; }
</style>
</head>
<body>
<div id="root" data-screen-label="Landing UI kit"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../Logo.jsx"></script>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Pillars.jsx"></script>
<script type="text/babel" src="TerminalDiff.jsx"></script>
<script type="text/babel" src="Pricing.jsx"></script>
<script type="text/babel">
function App() {
  return (
    <>
      <SiteHeader />
      <Hero />
      <Pillars />
      <TerminalDiff />
      <Pricing />
      <footer>
        <div className="container" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <Logo size={24} />
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 11 }}>© 2026 Mari · Built on the coast.</span>
        </div>
      </footer>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

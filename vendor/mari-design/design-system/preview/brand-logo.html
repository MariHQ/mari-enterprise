<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="kicker" style="margin-bottom:14px">/ Logo &amp; mark</div>
  <div class="row" style="gap:28px;align-items:center">
    <!-- Mark, large -->
    <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="30" height="30" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <path d="M7 25V9l9 9 9-9v16" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="miter"/>
      <rect x="5" y="7" width="4" height="4" fill="var(--ink)"/><rect x="23" y="7" width="4" height="4" fill="var(--ink)"/>
      <rect x="5" y="23" width="4" height="4" fill="var(--ink)"/><rect x="23" y="23" width="4" height="4" fill="var(--ink)"/>
      <rect x="14" y="16" width="4" height="4" fill="var(--biscay)"/>
    </svg>
    <!-- Lockup: mark + lowercase wordmark -->
    <div style="display:flex;align-items:center;gap:12px">
      <svg width="34" height="34" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="30" height="30" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <path d="M7 25V9l9 9 9-9v16" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="miter"/>
        <rect x="5" y="7" width="4" height="4" fill="var(--ink)"/><rect x="23" y="7" width="4" height="4" fill="var(--ink)"/>
        <rect x="5" y="23" width="4" height="4" fill="var(--ink)"/><rect x="23" y="23" width="4" height="4" fill="var(--ink)"/>
        <rect x="14" y="16" width="4" height="4" fill="var(--biscay)"/>
      </svg>
      <span style="font:800 26px var(--font-sans);letter-spacing:-0.03em;color:var(--ink)">mari</span>
    </div>
    <!-- Paper variant on ink field -->
    <div style="display:flex;align-items:center;gap:10px;background:var(--ink);padding:12px 16px">
      <svg width="26" height="26" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="30" height="30" fill="none" stroke="var(--paper)" stroke-width="2"/>
        <path d="M7 25V9l9 9 9-9v16" fill="none" stroke="var(--paper)" stroke-width="2.4" stroke-linejoin="miter"/>
        <rect x="5" y="7" width="4" height="4" fill="var(--paper)"/><rect x="23" y="7" width="4" height="4" fill="var(--paper)"/>
        <rect x="5" y="23" width="4" height="4" fill="var(--paper)"/><rect x="23" y="23" width="4" height="4" fill="var(--paper)"/>
        <rect x="14" y="16" width="4" height="4" fill="var(--espelette)"/>
      </svg>
      <span style="font:800 18px var(--font-sans);letter-spacing:-0.03em;color:var(--paper)">mari</span>
    </div>
  </div>
  <div class="mono dim" style="font-size:11px;margin-top:16px">mark · schematic M in a bordered square, ink lines + biscay center node. Paper variant (rust node) on dark fields. Sharp corners, no gradient.</div>
</div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="kicker" style="margin-bottom:18px">/ Shadows &amp; elevation</div>
  <div class="row" style="gap:14px">
    <div style="flex:1;text-align:center">
      <div style="height:64px;background:hsl(36 38% 97%);border:1px solid hsl(var(--border));border-radius:10px;box-shadow:0 1px 3px 0 hsl(24 10% 12% / 0.06),0 1px 2px -1px hsl(24 10% 12% / 0.06)"></div>
      <div class="mono dim" style="font-size:11px;margin-top:8px">shadow · cards (rare)</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="height:64px;background:hsl(36 38% 97%);border:1px solid hsl(var(--border));border-radius:10px;box-shadow:0 12px 24px -8px hsl(24 10% 12% / 0.12),0 4px 8px -4px hsl(24 10% 12% / 0.06)"></div>
      <div class="mono dim" style="font-size:11px;margin-top:8px">lg · drawers</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="height:64px;background:hsl(36 38% 97%);border:1px solid hsl(var(--border));border-radius:10px;box-shadow:0 24px 48px -12px hsl(24 10% 12% / 0.18)"></div>
      <div class="mono dim" style="font-size:11px;margin-top:8px">2xl · terminal mock</div>
    </div>
  </div>
  <div style="margin-top:22px">
    <div style="display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:hsl(24 10% 12%);color:hsl(36 38% 97%);border-radius:12px;font-weight:500;font-size:14px;box-shadow:0 1px 0 0 hsl(205 78% 26% / 0.6),0 10px 30px -12px hsl(205 78% 26% / 0.45)">Start with GitHub →</div>
    <div class="mono dim" style="font-size:11px;margin-top:8px">glow-primary · only on hero CTA + logo mark</div>
  </div>
</div>
</body></html>

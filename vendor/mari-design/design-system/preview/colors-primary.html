<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="height:240px">
  <div class="row" style="align-items:flex-start;gap:14px">
    <div style="flex:2;display:flex;flex-direction:column;gap:8px">
      <div class="kicker">/ Biscay — water</div>
      <div class="swatch" style="background:var(--biscay);color:var(--paper);min-height:140px;border:none">
        <div class="name" style="font-size:14px;color:#fff">biscay</div>
        <div class="val" style="color:rgba(255,255,255,0.75)">rgb(28 63 96) · #1C3F60</div>
      </div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <div class="swatch" style="background:var(--biscay-2);color:#fff;min-height:66px;border:none">
        <div class="name" style="color:#fff">biscay-2</div>
        <div class="val" style="color:rgba(255,255,255,0.75)">30 111 168 · #1E6FA8</div>
      </div>
      <div class="swatch" style="background:var(--ink);color:#fff;min-height:66px;border:none">
        <div class="name" style="color:#fff">ink</div>
        <div class="val" style="color:rgba(255,255,255,0.75)">16 38 59 · #10263B</div>
      </div>
    </div>
  </div>
  <div class="row" style="margin-top:10px;align-items:center;gap:8px">
    <div class="label">used on:</div>
    <div class="mono dim" style="font-size:11px">headings · links (biscay-2) · mark center node · focus ring · charts</div>
  </div>
</div>
</body></html>

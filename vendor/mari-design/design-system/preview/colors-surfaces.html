<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="kicker" style="margin-bottom:10px">/ Surface — paper &amp; flysch</div>
  <div class="grid-4">
    <div class="swatch" style="background:var(--paper)"><div class="name">paper</div><div class="val">#FFFFFF</div></div>
    <div class="swatch" style="background:var(--flysch)"><div class="name">flysch</div><div class="val">#F0F2F5</div></div>
    <div class="swatch" style="background:var(--ink);color:#fff;border:none"><div class="name" style="color:#fff">ink</div><div class="val" style="color:rgba(255,255,255,.75)">#10263B</div></div>
    <div class="swatch" style="background:var(--paper);border:1px solid var(--ink)"><div class="name">border</div><div class="val">ink hairline</div></div>
  </div>
  <div class="row" style="margin-top:14px;align-items:center;gap:8px">
    <div class="label">paper</div>
    <div style="flex:1;height:14px;background:linear-gradient(to right,var(--paper),var(--flysch));border:1px solid var(--ink)"></div>
    <div class="label">flysch</div>
  </div>
  <div class="mono dim" style="font-size:11px;margin-top:10px">separation is a 1px ink border plus a hard offset block shadow. Never a soft drop shadow or a tinted card.</div>
</div>
</body></html>

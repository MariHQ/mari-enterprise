<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="kicker" style="margin-bottom:14px">/ Radius scale</div>
  <div class="row" style="gap:14px">
    <div style="flex:1;text-align:center"><div style="height:64px;background:hsl(35 30% 95%);border:1px solid hsl(var(--border));border-radius:4px"></div><div class="mono dim" style="font-size:11px;margin-top:6px">sm · 6.4px</div></div>
    <div style="flex:1;text-align:center"><div style="height:64px;background:hsl(35 30% 95%);border:1px solid hsl(var(--border));border-radius:8px"></div><div class="mono dim" style="font-size:11px;margin-top:6px">md · 8.4px</div></div>
    <div style="flex:1;text-align:center"><div style="height:64px;background:hsl(35 30% 95%);border:1px solid hsl(var(--border));border-radius:10.4px"></div><div class="mono dim" style="font-size:11px;margin-top:6px">lg · 10.4px (--radius)</div></div>
    <div style="flex:1;text-align:center"><div style="height:64px;background:hsl(35 30% 95%);border:1px solid hsl(var(--border));border-radius:16px"></div><div class="mono dim" style="font-size:11px;margin-top:6px">xl · 16px</div></div>
    <div style="flex:1;text-align:center"><div style="height:64px;background:hsl(35 30% 95%);border:1px solid hsl(var(--border));border-radius:24px"></div><div class="mono dim" style="font-size:11px;margin-top:6px">2xl · 24px</div></div>
    <div style="flex:1;text-align:center"><div style="height:64px;background:hsl(35 30% 95%);border:1px solid hsl(var(--border));border-radius:9999px"></div><div class="mono dim" style="font-size:11px;margin-top:6px">pill</div></div>
  </div>
  <div class="mono dim" style="font-size:11px;margin-top:14px">cards: lg · pricing cards: 2xl · CTA panel: 3xl · pills/chips: pill</div>
</div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="kicker" style="margin-bottom:10px">/ Ink — foreground &amp; muted</div>
  <div class="row" style="gap:14px;align-items:flex-start">
    <div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <div class="swatch" style="background:var(--ink);color:#fff;border:none;min-height:64px">
        <div class="name" style="color:#fff">ink</div>
        <div class="val" style="color:rgba(255,255,255,0.75)">16 38 59 · #10263B</div>
      </div>
      <div class="swatch" style="background:var(--muted);color:#fff;border:none;min-height:48px">
        <div class="name" style="color:#fff">muted</div>
        <div class="val" style="color:rgba(255,255,255,0.75)">ink @ 62%</div>
      </div>
    </div>
    <div style="flex:1.4;font-size:14px;line-height:1.55;align-self:stretch;display:flex;flex-direction:column;justify-content:center">
      <div style="color:var(--ink);font-weight:800;letter-spacing:-0.02em;font-size:18px">Claim-checking for AI coding agents.</div>
      <div style="color:var(--ink);margin-top:6px">Body copy is full-strength ink on paper, for maximum legibility with no washed-out grays.</div>
      <div style="color:var(--muted);margin-top:6px">Muted is for subheads, table cells, and microcopy under CTAs.</div>
    </div>
  </div>
</div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="padding:0">
  <div style="position:relative;height:240px;width:100%;background:hsl(36 38% 97%);overflow:hidden">
    <div style="position:absolute;inset:0;background:linear-gradient(to right, hsl(30 18% 84% / 0.4) 1px, transparent 1px) 0 0/48px 48px,linear-gradient(to bottom, hsl(30 18% 84% / 0.4) 1px, transparent 1px) 0 0/48px 48px;opacity:0.18"></div>
    <div style="position:absolute;left:50%;top:-20%;transform:translateX(-50%);height:380px;width:560px;border-radius:9999px;filter:blur(80px);opacity:0.5;background:radial-gradient(closest-side, hsl(205 78% 26% / 0.55), transparent 70%)"></div>
    <div style="position:absolute;left:8%;top:30%;height:240px;width:240px;border-radius:9999px;filter:blur(80px);opacity:0.4;background:radial-gradient(closest-side, hsl(199 64% 36% / 0.7), transparent 70%)"></div>
    <div style="position:absolute;right:8%;top:15%;height:240px;width:240px;border-radius:9999px;filter:blur(80px);opacity:0.3;background:radial-gradient(closest-side, hsl(158 55% 28% / 0.6), transparent 70%)"></div>
    <div style="position:relative;z-index:2;padding:24px 32px">
      <div class="kicker">/ Hero glow recipe</div>
      <div style="font:600 32px var(--font-sans);letter-spacing:-0.02em;line-height:1.05;margin-top:14px">
        Documentation, grounded
        <span style="background:linear-gradient(120deg,hsl(24 10% 12%) 0%,hsl(205 78% 26%) 60%,hsl(199 64% 36%) 100%);-webkit-background-clip:text;background-clip:text;color:transparent">like the coast itself.</span>
      </div>
      <div class="mono dim" style="font-size:11px;margin-top:10px">grid 18% + blue radial center + teal radial L + emerald radial R · all blur-3xl.</div>
    </div>
  </div>
</div>
</body></html>

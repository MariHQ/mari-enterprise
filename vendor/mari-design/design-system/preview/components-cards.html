<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="kicker" style="margin-bottom:14px">/ Cards</div>
  <div class="row" style="gap:12px">
    <div style="flex:1;border:1px solid hsl(var(--border));border-radius:10.4px;background:hsl(36 38% 97%);padding:18px">
      <div style="display:inline-flex;align-items:center;justify-content:center;height:36px;width:36px;border-radius:8px;background:hsl(30 18% 86%);color:hsl(199 64% 36%)">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
      </div>
      <div style="margin-top:14px;display:flex;align-items:baseline;gap:6px"><span class="mono dim" style="font-size:11px">01</span><span style="font-size:16px;font-weight:600">Knowledge</span></div>
      <div style="margin-top:6px;font-size:13px;line-height:1.5;color:hsl(25 8% 38%)">Continuously ingests Slack threads, PRs, and architecture diagrams.</div>
    </div>
    <div style="flex:1;border:1px solid hsl(205 78% 26% / 0.6);border-radius:16px;background:hsl(36 38% 97% / 0.75);backdrop-filter:saturate(140%) blur(14px);padding:18px;box-shadow:0 0 40px -20px hsl(205 78% 26% / 0.55);position:relative">
      <div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:16px;font-weight:600">Team</span><span style="padding:2px 10px;border:1px solid hsl(205 78% 26% / 0.4);border-radius:9999px;font-family:var(--font-mono);font-size:10px;color:hsl(199 64% 36%);text-transform:uppercase;letter-spacing:0.18em">Most popular</span></div>
      <div style="margin-top:10px;display:flex;align-items:baseline;gap:4px"><span style="font-size:30px;font-weight:600;letter-spacing:-0.01em">$350</span><span style="font-size:12px;color:hsl(25 8% 38%)">/ per dev / mo</span></div>
      <div style="margin-top:8px;font-size:13px;color:hsl(25 8% 38%)">For 5–50 person engineering orgs.</div>
    </div>
  </div>
  <div class="mono dim" style="font-size:11px;margin-top:10px">left: pillar tile · right: glass + halo (highlight pricing).</div>
</div>
</body></html>

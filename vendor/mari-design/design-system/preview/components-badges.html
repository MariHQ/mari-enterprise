<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="kicker" style="margin-bottom:14px">/ Pills, badges &amp; status</div>
  <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
    <span style="display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border:1px solid hsl(var(--border));border-radius:9999px;background:hsl(35 30% 95% / 0.6);font-family:var(--font-mono);font-size:12px;color:hsl(25 8% 38%)">
      <span style="height:6px;width:6px;border-radius:9999px;background:hsl(158 55% 28%)"></span>
      v3.2 — autonomous PR drafting now in GA →
    </span>
  </div>
  <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px">
    <span style="padding:2px 10px;border-radius:9999px;background:hsl(205 78% 26%);color:#fff;font:600 12px var(--font-sans)">primary</span>
    <span style="padding:2px 10px;border-radius:9999px;background:hsl(35 22% 90%);color:hsl(24 10% 12%);font:600 12px var(--font-sans)">secondary</span>
    <span style="padding:2px 10px;border-radius:9999px;background:hsl(347 77% 45%);color:#fff;font:600 12px var(--font-sans)">destructive</span>
    <span style="padding:2px 10px;border-radius:9999px;border:1px solid hsl(var(--border));color:hsl(24 10% 12%);font:600 12px var(--font-sans)">outline</span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid hsl(205 78% 26% / 0.4);border-radius:9999px;font-family:var(--font-mono);font-size:11px;color:hsl(199 64% 36%);text-transform:uppercase;letter-spacing:0.18em">Most popular</span>
  </div>
  <div class="row" style="gap:14px;margin-top:14px;align-items:center">
    <span class="mono dim" style="font-size:11px">live status</span>
    <span style="height:8px;width:8px;border-radius:9999px;background:hsl(158 55% 28%);box-shadow:0 0 0 2px hsl(36 38% 97%)"></span>
    <span class="mono dim" style="font-size:11px">+ ring-2 ring-background</span>
  </div>
</div>
</body></html>

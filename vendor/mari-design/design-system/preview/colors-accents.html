<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="kicker" style="margin-bottom:10px">/ Semantic accents — used sparingly</div>
  <div class="grid-3">
    <div class="swatch" style="background:var(--moss);color:#fff;border:none">
      <div class="name">moss</div>
      <div class="val" style="color:rgba(255,255,255,0.75)">#2C6E49 · ok / passing</div>
    </div>
    <div class="swatch" style="background:var(--clay);color:#fff;border:none">
      <div class="name">clay</div>
      <div class="val" style="color:rgba(255,255,255,0.75)">#A05E1C · stale / warning</div>
    </div>
    <div class="swatch" style="background:var(--espelette);color:#fff;border:none">
      <div class="name">espelette</div>
      <div class="val" style="color:rgba(255,255,255,0.75)">#B23A1E · rust · alert / accent</div>
    </div>
  </div>
  <div class="row" style="margin-top:14px;gap:14px">
    <div class="row" style="gap:6px;align-items:center">
      <span style="height:8px;width:8px;background:var(--moss);display:inline-block"></span>
      <span class="mono dim" style="font-size:11px">claim verified</span>
    </div>
    <div class="row" style="gap:6px;align-items:center">
      <span style="height:8px;width:8px;background:var(--clay);display:inline-block"></span>
      <span class="mono dim" style="font-size:11px">stale &gt; 30d</span>
    </div>
    <div class="row" style="gap:6px;align-items:center">
      <span style="height:8px;width:8px;background:var(--espelette);display:inline-block"></span>
      <span class="mono dim" style="font-size:11px">unsupported claim</span>
    </div>
  </div>
</div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="kicker" style="margin-bottom:14px">/ Buttons</div>
  <div class="row" style="gap:10px;flex-wrap:wrap;align-items:center">
    <button style="border:0;height:40px;padding:0 20px;border-radius:12px;background:hsl(24 10% 12%);color:hsl(36 38% 97%);font:500 14px var(--font-sans);box-shadow:0 1px 0 0 hsl(205 78% 26% / 0.6),0 10px 30px -12px hsl(205 78% 26% / 0.45);cursor:pointer">Start with GitHub →</button>
    <button style="border:1px solid hsl(var(--border));height:40px;padding:0 20px;border-radius:12px;background:hsl(35 30% 95%);color:hsl(24 10% 12%);font:500 14px var(--font-sans);cursor:pointer">See Demo</button>
    <button style="border:0;height:40px;padding:0 16px;border-radius:8px;background:hsl(205 78% 26%);color:hsl(36 38% 97%);font:500 14px var(--font-sans);cursor:pointer">Subscribe</button>
  </div>
  <div class="row" style="gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap">
    <button style="border:1px solid hsl(var(--border));height:36px;padding:0 12px;border-radius:6px;background:hsl(36 38% 97%);color:hsl(24 10% 12%);font:500 13px var(--font-sans);cursor:pointer">Outline</button>
    <button style="border:0;height:36px;padding:0 12px;border-radius:6px;background:transparent;color:hsl(24 10% 12%);font:500 13px var(--font-sans);cursor:pointer">Ghost</button>
    <button style="border:0;height:36px;padding:0;background:transparent;color:hsl(199 64% 36%);font:500 13px var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px">Link</button>
    <button style="border:0;height:36px;padding:0 12px;border-radius:6px;background:hsl(347 77% 45%);color:#fff;font:500 13px var(--font-sans);cursor:pointer">Destructive</button>
  </div>
  <div class="mono dim" style="font-size:11px;margin-top:12px">primary CTA inverts to foreground-on-bg with primary glow. No press scale.</div>
</div>
</body></html>
